# Nome da Action
name: Generate Datas

# Quando ela vai rodar?
on:
  schedule: # A cada 24 horas
    - cron: "* */24 * * *"
  workflow_dispatch: # Permite rodar manualmente se quiser

# O que ela vai fazer?
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Clona seu repositório
      - name: checkout repo content
        uses: actions/checkout@v3

      # 2. Gera a animação da cobrinha
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Pega as imagens geradas e joga numa branch separada chamada "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
